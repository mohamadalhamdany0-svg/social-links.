<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>محمد عبدالله الحمداني | حساباتي</title>
<style>
:root{--bg:#0c1220;--card:#151f31;--muted:#aebbd0;--text:#f7f9fc;--line:#26354c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 16px;background:radial-gradient(circle at top,#24334d 0,#0c1220 48%);color:var(--text);font-family:Tahoma,Arial,sans-serif;display:flex;justify-content:center;align-items:center}
main{width:min(100%,460px);text-align:center}
.card{background:rgba(21,31,49,.96);border:1px solid var(--line);border-radius:28px;padding:28px 22px;box-shadow:0 24px 70px #0008}
img{width:142px;height:142px;object-fit:cover;object-position:center 35%;border-radius:50%;border:4px solid #e7edf7;box-shadow:0 8px 28px #0007}
h1{font-size:25px;margin:18px 0 7px}
.sub{color:var(--muted);font-size:14px;margin:0 0 25px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#101827;background:#f2f5fa;border-radius:15px;padding:15px 18px;font-size:17px;font-weight:700;transition:transform .15s,background .15s}
.link:hover{transform:translateY(-2px);background:#fff}
.ico{width:25px;text-align:center;font-size:19px}
footer{color:#8796ad;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
<section class="card">
<img src="profile.jpg" alt="صورة محمد عبدالله الحمداني">

</nav>
